name: Open-breakout watcher

# Runs on GitHub's servers (NOT your Mac) once each weekday around the US open,
# loops internally every 45s through the 09:45-11:00 ET window, then exits.
# Real-time Alpaca IEX data. Zero Claude usage. NOT financial advice.
on:
  schedule:
    # GitHub's scheduler is best-effort: runs are often delayed 5-20 min or
    # dropped entirely, so we fire several redundant starts per season, a few
    # minutes apart and BEFORE the 09:45 ET window opens. The script exits fast
    # on any "wrong-season" or out-of-window start, and the concurrency group
    # keeps the first good start holding the slot (no double-alerts).
    # US summer (EDT): open 13:30 UTC, window 13:45-15:00 UTC
    - cron: "25 13 * * 1-5"   # ~09:25 ET (EDT)
    - cron: "35 13 * * 1-5"   # ~09:35 ET (EDT)
    - cron: "45 13 * * 1-5"   # ~09:45 ET (EDT)
    # US winter (EST): open 14:30 UTC, window 14:45-16:00 UTC
    - cron: "25 14 * * 1-5"   # ~09:25 ET (EST)
    - cron: "35 14 * * 1-5"   # ~09:35 ET (EST)
    - cron: "45 14 * * 1-5"   # ~09:45 ET (EST)
  workflow_dispatch: {}        # manual "Run workflow" button for testing
  repository_dispatch:         # PRIMARY reliable trigger: an external cron
    types: [open-breakout]     # (cron-job.org) POSTs this each weekday morning,
                               # so the fire does NOT depend on GitHub's flaky
                               # best-effort scheduler. The schedule: crons above
                               # stay as a free backup; the concurrency group
                               # stops any double-alert (a 2nd start only runs
                               # after the window closes, then exits at once).

concurrency:
  group: ob-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 120        # safety cap; the script exits after the window
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run open-breakout watcher
        env:
          # Add these as repo Secrets (Settings -> Secrets and variables -> Actions):
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OB_POLL_SEC: "45"
        run: python ob_watcher.py loop
